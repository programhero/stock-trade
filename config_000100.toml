# qtrade 专用配置：000100 TCL科技（1 分钟日内做 T）
#
# 该配置由 .claude/skills/tune-stock 在
#   data/000100_1min.csv（2026-11-02 ~ 2026-11-06，1200 根 1 分钟 K 线）
# 上做 10 轮参数搜索后得到。评价口径为“剔除底仓市值波动后的做 T 交易净盈亏”，
# 而非账户总盈亏（本区间底仓从 4.46 涨到 4.57，贡献约 +8,140 元）。
#
# ===== 低价股滑点说明（非常重要）=====
# 000100 价格约 4.5 元，最小变动价位 0.01 元约等于 0.22%。
# 项目默认的 1bp 滑点只有 0.00045 元，四舍五入后为 0，等于“零滑点”回测；
# 一档滑点 = 0.01 元 / 4.5 元 ≈ 22bp。因此本配置把 slippage_bps 设为 22.4（一档）。
#
# 回测结果（22.4bp = 一档滑点，默认费率）：
#   做 T 交易净盈亏 +1,704.46 元 | 5 次配对 | 配对胜率 100% | 最大交易回撤 1,041 元
#   五个交易日每天的交易净盈亏均为正（+764 / +164 / +160 / +156 / +460）
#   手续费 695.54 元 | 10 笔成交（5 买 / 5 卖）| 0 拒单
#   23bp 与 22.4bp 同为 +1,704（同一档）；但 34bp（约两档）为 -994.71，仅 1/5 天盈利。
#   作为对照：0 滑点（1bp 取整后）为 +4,703.72，但不可作为实盘预期。
#   正式回测（账户口径）：初始权益 1,330,040.00 -> 1,339,884.46，
#     总盈亏 +9,844.46 元（+0.74%），最大回撤 13,163.75 元（0.97%）。
#     账户日盈亏仅 2/5 天为正（-5,156 / +12,744 / +9,780 / -3,544 / -3,980），
#     主要由底仓市值波动决定；做 T 本身 5/5 天为正。
#   报告目录：reports/000100_backtest_20261107_115337
#
# 关键结论（样本内）：
#   1. 该股呈现“早盘冲高、午后回落”：10:05 后第一次 VWAP 正偏离高抛，
#      13:30 左右回补，5 个交易日每天一轮，全部盈利。
#   2. entry_z=1.6、window=20 是唯一能在 12bp 下维持 5/5 天的信号组合；
#      邻域 window 18-22、z 1.5-1.6、warmup 34-38 均可，但 eod 必须 13:30
#      （13:20 或 13:40 都会破坏 5/5）。
#   3. 策略平均每对毛利约 2~3 个最小变动价位；一档往返滑点约吃掉 2 个价位，
#      两档即转亏。**执行质量是这份配置能否成立的前提。**
#
# 注意：仅 5 个交易日、5 次配对，且 eod 精确落在 13:30，过拟合风险很高。
# 实盘前请用更长区间和纸面交易验证；若无法稳定做到 ≤1 档滑点，不建议实盘使用。
# 运行：python main.py backtest --config config_000100.toml

[symbol]
code = "000100"
name = "TCL科技"
exchange = "SZ"

[data]
source = "csv"
csv_path = "data/000100_1min.csv"
synthetic_days = 5
synthetic_seed = 20261106
synthetic_start_price = 100.0
lookback_days = 5
poll_seconds = 15

[broker]
initial_cash = 1000000.0
# 底仓 74,000 股（约 33 万元市值，与其他配置的底仓市值对齐）
initial_position = 74000
# 0 = 用首根 K 线开盘价作为底仓成本
initial_avg_cost = 0.0
# 低价股：22.4bp = 0.01 元（一档）；不要用 1bp（等于零滑点）
slippage_bps = 22.4

[broker.fees]
commission_rate = 0.00025   # 佣金万 2.5
min_commission = 5.0        # 单笔最低佣金
stamp_duty_rate = 0.0005    # 印花税 0.05%，仅卖出
transfer_fee_rate = 0.00001 # 过户费 0.001%，双向

[risk]
max_order_notional = 1000000.0
max_daily_trades = 60           # 实测每日仅 2 笔
# 日内亏损按含底仓市值的账户权益计算。74,000 股底仓约 33 万元，
# 本区间最大隔夜跳空约 -8,900 元（11-06），20,000 元阈值只拦截极端行情。
max_daily_loss = 20000.0
max_position_deviation = 30000  # 必须 >= max_offset_lots * lot_size = 300 * 100
min_order_interval_bars = 1
price_limit_pct = 0.10

[strategy]
name = "vwap_scalper"
base_position = 74000
lot_size = 100
max_offset_lots = 300       # 最多减仓 30,000 股（约 40% 底仓）
order_qty_lots = 300        # 每次信号 30,000 股，一天一轮
warmup_bars = 35            # 10:05 后才允许高抛：等待早盘冲高形成
zscore_window = 20          # 短窗口对早盘偏离更敏感
entry_z = 1.6               # 只在偏离 1.6 个标准差以上高抛
take_profit_pct = 0.010     # 较卖出均价回落 1% 回补（实际多由 z 回补触发）
last_entry_time = "10:30"   # 10:30 后不再高抛：避免 11-04 式的二次追空
eod_restore_time = "13:30"  # 13:30 强制回补：本区间午后低点集中在该时点
restore_at_close = true
min_bar_amount = 0.0
