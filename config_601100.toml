# qtrade 专用配置：601100 恒立液压（1 分钟日内做 T）
#
# 该配置由 scripts/tune_601100.py 在
#   data/601100_1min.csv（2026-11-02 ~ 2026-11-06，1200 根 1 分钟 K 线）
# 上做 10 轮参数搜索后得到。评价口径为“剔除底仓市值波动后的做 T 交易净盈亏”，
# 而非账户总盈亏（本区间底仓随股价从 83.41 涨到 89.10，贡献约 +22,760 元，
# 会完全掩盖策略本身的表现）。
#
# 回测结果（1bp 单边滑点、默认费率）：
#   做 T 交易净盈亏 +9,017.16 元 | 49 次配对 | 配对胜率 100% | 最大交易回撤 1,249 元
#   五个交易日每天的交易净盈亏均为正（+3,124 / +1,346 / +2,997 / +1,377 / +173）
#   2bp 滑点：+8,833 元；3bp 滑点：+8,477 元，仍为 5/5 天盈利
#   正式回测（账户口径）：初始权益 1,333,640.00 -> 1,365,417.16，
#     总盈亏 +31,777.16 元（+2.38%），最大回撤 16,902.66 元（1.23%），0 拒单。
#     账户日盈亏为 +10,244 / +7,306 / +6,917 / +17,257 / -9,947：11-06 的
#     账户日亏损来自 -2.87% 隔夜跳空（约 -10,100 元），做 T 本身当日仍为 +173。
#   报告目录：reports/601100_backtest_20261107_104137
#
# 关键结论（样本内）：
#   1. 该股上午以单边上行为主，早盘高抛会被趋势碾压；因此 warmup_bars=115
#      （11:25 前只观察）是本次调优最大的单项改进。
#   2. 高波动（日振幅 4%~7%）使 1% 的回补价差能覆盖约 0.11% 的往返成本，
#      且比 0.3%~0.7% 的窄价差更不容易在趋势日被迫追高回补。
#   3. 单笔 2 手（200 股）分批建仓，比一次性 4~8 手有更细的均价控制；
#      最大偏离 16 手（1,600 股，约底仓 40%）是收益/回撤的折中点。
#
# 注意：仅 5 个交易日样本，且样本内配对胜率 100%，存在明显过拟合风险。
# 实盘前请用更长区间、不同市况（尤其是午后单边上行日）做纸面验证。
# 运行：python main.py backtest --config config_601100.toml

[symbol]
code = "601100"
name = "恒立液压"
exchange = "SH"

[data]
source = "csv"
csv_path = "data/601100_1min.csv"
synthetic_days = 5
synthetic_seed = 20261106
synthetic_start_price = 100.0
lookback_days = 5
poll_seconds = 15

[broker]
initial_cash = 1000000.0
# 底仓 4,000 股（约 34 万元市值，与 002352 配置的底仓市值对齐）
initial_position = 4000
# 0 = 用首根 K 线开盘价作为底仓成本，避免演示成本价造成已实现盈亏失真
initial_avg_cost = 0.0
slippage_bps = 1.0

[broker.fees]
commission_rate = 0.00025   # 佣金万 2.5
min_commission = 5.0        # 单笔最低佣金
stamp_duty_rate = 0.0005    # 印花税 0.05%，仅卖出
transfer_fee_rate = 0.00001 # 过户费 0.001%，双向

[risk]
max_order_notional = 1000000.0
max_daily_trades = 60           # 实测单日最多约 24 笔，60 足够
# 日内亏损按“包含底仓市值”的账户权益计算，隔夜跳空也会计入。
# 该股 4,000 股底仓约 34 万元市值，1% 跳空约 3,400 元；本区间 11-06
# 跳空约 -2.87%（约 -11,500 元）。阈值 20,000 元（约权益 1.5%）只拦截极端行情。
max_daily_loss = 20000.0
max_position_deviation = 1600   # 必须 >= max_offset_lots * lot_size = 16 * 100
min_order_interval_bars = 1
price_limit_pct = 0.10

[strategy]
name = "vwap_scalper"
base_position = 4000
lot_size = 100
max_offset_lots = 16        # 最多减仓 1,600 股（约 40% 底仓）
order_qty_lots = 2          # 每次信号 200 股，分 8 档建仓，均价更平滑
warmup_bars = 115           # 11:25 前只观察：避开该股上午的单边上行段
zscore_window = 35          # 35 分钟窗口的 VWAP 偏离更稳定
entry_z = 2.6               # 偏离 2.6 个标准差以上才高抛
take_profit_pct = 0.010     # 较卖出均价回落 1.0% 才回补，覆盖约 0.11% 往返成本
last_entry_time = "14:00"   # 14:00 后不再高抛，留出尾盘回补时间
eod_restore_time = "14:45"  # 14:45 后强制回补底仓
restore_at_close = true
min_bar_amount = 0.0
